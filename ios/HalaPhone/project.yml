name: HalaPhone
options:
  bundleIdPrefix: com.teamkanban
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # The HALA server the app opens pointed at (a tunnel URL). Empty is fine: scanning the robot's QR sets it.
    HALA_DEFAULT_SERVER: ""

packages:
  ElevenLabs:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk.git
    exactVersion: 4.0.0

targets:
  HalaPhone:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: ElevenLabs
        product: ElevenLabs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teamkanban.halaphone
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_STYLE: Manual
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: HALA Phone
        HALAServer: "$(HALA_DEFAULT_SERVER)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: HALA Phone uses the microphone so you can talk to the HALA voice assistant.
        NSLocalNetworkUsageDescription: HALA Phone connects to the HALA server and to the voice service.
        NSUserNotificationsUsageDescription: HALA Phone tells you when HALA calls or texts you.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.teamkanban.halaphone.link
            CFBundleURLSchemes:
              - halaphone
